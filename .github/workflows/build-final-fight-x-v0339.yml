name: Build OpenBOR Native Builder v0.34.19

on:
  push:
    branches:
      - build-openbor-v03419
    paths:
      - ".github/workflows/build-final-fight-x-v0339.yml"
      - "ci/openbor-v03419/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Builder branch
        uses: actions/checkout@v4

      - name: Reconstruct v0.34.19 source
        shell: pwsh
        run: |
          $parts = Get-ChildItem "ci/openbor-v03419/hex*.txt" | Sort-Object Name
          if ($parts.Count -ne 6) { throw "Expected 6 source chunks, found $($parts.Count)" }
          $hex = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ""
          if (($hex.Length % 2) -ne 0) { throw "Invalid hex payload" }
          $archive = Join-Path $env:RUNNER_TEMP "openbor-v03419.tar.xz"
          [IO.File]::WriteAllBytes($archive, [Convert]::FromHexString($hex))
          tar -xf $archive -C $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $src = Join-Path $env:RUNNER_TEMP "ob19_payload"
          $cmakePath = Join-Path $src "CMakeLists.txt"
          $lines = @(Get-Content $cmakePath)
          $cut = [Array]::IndexOf($lines, "enable_testing()")
          if ($cut -ge 0) {
            $lines = $lines[0..($cut - 1)]
            Set-Content -Encoding UTF8 $cmakePath -Value $lines
          }
          "OBNB_SRC=$src" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure Builder Win64 ClangCL
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP "openbor-v03419-build"
          cmake -S "$env:OBNB_SRC" -B "$build" -G "Visual Studio 18 2026" -A x64 -T ClangCL -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "OBNB_BUILD=$build" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build Builder Release
        shell: pwsh
        run: |
          cmake --build "$env:OBNB_BUILD" --config Release --target openbor-native-builder -- /m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Get-ChildItem "$env:OBNB_BUILD" -Recurse -Filter "openbor-native-builder.exe" | Select-Object -First 1
          if (-not $exe) { throw "Builder EXE not generated" }
          "OBNB_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Verify Builder version
        shell: pwsh
        run: |
          $out = & "$env:OBNB_EXE" version 2>&1
          $text = ($out | Out-String)
          Write-Host $text
          if ($text -notmatch "OpenBOR Native Builder 0\.34\.19") { throw "Wrong Builder version" }
          exit 0

      - name: Generate gameplay smoke fixture
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP "openbor-v03419-fixture"
          New-Item -ItemType Directory -Force -Path (Join-Path $fixture "data/chars") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $fixture "data/levels") | Out-Null
          Set-Content -Encoding ASCII (Join-Path $fixture "data/models.txt") -Value @(
            "load Hero data/chars/hero.txt",
            "load Dummy data/chars/dummy.txt"
          )
          Set-Content -Encoding ASCII (Join-Path $fixture "data/levels.txt") -Value @(
            "set Smoke",
            "cansave 2",
            "file data/levels/smoke.txt"
          )
          Set-Content -Encoding ASCII (Join-Path $fixture "data/chars/hero.txt") -Value @(
            "name Hero","type player","health 120","speed 2.5","runspeed 4",
            "anim idle","loop 1","delay 8","frame none",
            "anim walk","loop 1","delay 6","move 2","frame none",
            "anim attack1","delay 4","attack 0 0 40 40 8","frame none",
            "anim jump","delay 4","jumpframe 0 4 2 0","frame none"
          )
          Set-Content -Encoding ASCII (Join-Path $fixture "data/chars/dummy.txt") -Value @(
            "name Dummy","type enemy","health 9999","speed 0","nomove 1",
            "anim idle","loop 1","delay 10","frame none"
          )
          Set-Content -Encoding ASCII (Join-Path $fixture "data/levels/smoke.txt") -Value @(
            "direction right","spawn1 20 5 0","wall 0 180 8 8","hole 20 165 18 18",
            "spawn Dummy","coords 180 205 0","at 0","boss 1"
          )
          $port = Join-Path $env:RUNNER_TEMP "generated-v03419-port"
          & "$env:OBNB_EXE" convert "$fixture" "$port"
          if ($LASTEXITCODE -ne 0) { throw "Builder failed to generate test port" }
          $engine = Get-Content (Join-Path $port "runtime/src/Engine.cpp") -Raw
          if ($engine -notmatch "runSmokeGame" -or $engine -notmatch "save_version=2" -or $engine -notmatch "findSafePlayerSpawnPoint" -or $engine -notmatch "effectiveCombatType") { throw "v0.34.19 runtime features missing" }
          $portableScript = Get-Content (Join-Path $port "BUILD-PORTABLE-WINDOWS.ps1") -Raw
          if ($portableScript -notmatch "SMOKE-TESTE.cmd") { throw "Smoke launcher missing from generated port" }
          "TEST_PORT=$port" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build generated game runtime Win64
        shell: pwsh
        run: |
          $rb = Join-Path "$env:TEST_PORT" "runtime/build-win64-ci"
          cmake -S (Join-Path "$env:TEST_PORT" "runtime") -B $rb -G "Visual Studio 18 2026" -A x64 -T ClangCL -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build $rb --config Release --target openbor-port -- /m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $game = Get-ChildItem $rb -Recurse -Filter "openbor-port.exe" | Select-Object -First 1
          if (-not $game) { throw "Generated game EXE missing" }
          "TEST_GAME=$($game.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Diagnose generated game
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "$env:TEST_GAME" -ArgumentList "--diagnose" -WorkingDirectory "$env:TEST_PORT" -PassThru -Wait
          if ($proc.ExitCode -ne 0) { throw "Diagnose failed with code $($proc.ExitCode)" }
          $log = Join-Path "$env:TEST_PORT" "runtime-startup.log"
          if (-not (Test-Path $log)) { throw "runtime-startup.log missing" }
          $body = Get-Content $log -Raw
          Write-Host $body
          if ($body -notmatch "DIAGNOSE OK") { throw "DIAGNOSE OK missing" }

      - name: Run real gameplay smoke on Windows
        timeout-minutes: 3
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "$env:TEST_GAME" -ArgumentList "--smoke-game","--smoke-frames=300" -WorkingDirectory "$env:TEST_PORT" -PassThru -Wait
          Write-Host "Smoke exit=$($proc.ExitCode)"
          $log = Join-Path "$env:TEST_PORT" "runtime-startup.log"
          if (Test-Path $log) { Get-Content $log }
          $crash = Join-Path "$env:TEST_PORT" "runtime-crash.log"
          if (Test-Path $crash) { Get-Content $crash }
          if ($proc.ExitCode -ne 0) { throw "Gameplay smoke failed with code $($proc.ExitCode)" }
          $body = Get-Content $log -Raw
          if ($body -notmatch "SMOKE GAME OK frames=300") { throw "SMOKE GAME OK missing" }

      - name: Assemble portable Builder
        shell: pwsh
        run: |
          $name = "OpenBOR-Native-Builder-v0.34.19-Portable-Windows-x64"
          $dist = Join-Path $env:RUNNER_TEMP $name
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item "$env:OBNB_EXE" (Join-Path $dist "OpenBOR-Native-Builder.exe")
          $readme = @(
            "OpenBOR Native Builder v0.34.19 - Portable Windows x64",
            "",
            "Runtime Reliability + Combat Fidelity",
            "- gameplay smoke test real (--smoke-game)",
            "- safe player spawn around wall/hole",
            "- projectile/weapon owner combat inheritance",
            "- Save V2 for player state and weapons",
            "- startup/crash diagnostics from v0.34.18 retained",
            "",
            "Windows CI validated: Builder build, generated runtime build, --diagnose and 300-frame gameplay smoke."
          ) -join [Environment]::NewLine
          Set-Content -Encoding UTF8 (Join-Path $dist "LEIA-ME.txt") -Value $readme
          $hash = (Get-FileHash (Join-Path $dist "OpenBOR-Native-Builder.exe") -Algorithm SHA256).Hash.ToLower()
          Set-Content -Encoding ASCII (Join-Path $dist "SHA256.txt") -Value ($hash + "  OpenBOR-Native-Builder.exe")
          $zip = Join-Path $env:RUNNER_TEMP ($name + ".zip")
          Compress-Archive -Path $dist -DestinationPath $zip -CompressionLevel Optimal -Force
          "OBNB_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload portable Builder
        uses: actions/upload-artifact@v4
        with:
          name: OpenBOR-Native-Builder-v0.34.19-Portable-Windows-x64
          path: ${{ env.OBNB_ZIP }}
          if-no-files-found: error
          retention-days: 1
