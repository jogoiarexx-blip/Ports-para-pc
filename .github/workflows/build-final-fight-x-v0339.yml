name: Build OpenBOR Native Builder v0.34.22 MinGW

on:
  push:
    branches: [build-openbor-v03422]
    paths:
      - ".github/workflows/build-final-fight-x-v0339.yml"
      - "ci/openbor-v03422/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build mingw-w64

      - name: Reconstruct source
        run: |
          cat ci/openbor-v03422/hex*.txt | tr -d '[:space:]' | xxd -r -p > /tmp/openbor-v03422.tar.xz
          tar -xJf /tmp/openbor-v03422.tar.xz -C /tmp
          test -f /tmp/OpenBOR-Native-Builder-v0.34.22-Source-Code/CMakeLists.txt
          echo "OBNB_SRC=/tmp/OpenBOR-Native-Builder-v0.34.22-Source-Code" >> "$GITHUB_ENV"

      - name: Build native Builder for fixture generation
        run: |
          cmake -S "$OBNB_SRC" -B /tmp/ob22-native -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/ob22-native --target openbor-native-builder -j2
          /tmp/ob22-native/openbor-native-builder version || true
          echo "NATIVE_BUILDER=/tmp/ob22-native/openbor-native-builder" >> "$GITHUB_ENV"

      - name: Build Windows x64 Builder with MinGW
        run: |
          cmake -S "$OBNB_SRC" -B /tmp/ob22-win -G Ninja             -DCMAKE_BUILD_TYPE=Release             -DCMAKE_SYSTEM_NAME=Windows             -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++             -DCMAKE_RC_COMPILER=x86_64-w64-mingw32-windres
          cmake --build /tmp/ob22-win --target openbor-native-builder -j2
          test -f /tmp/ob22-win/openbor-native-builder.exe
          file /tmp/ob22-win/openbor-native-builder.exe
          x86_64-w64-mingw32-objdump -p /tmp/ob22-win/openbor-native-builder.exe | grep -E "DLL Name|Subsystem" | head -30

      - name: Generate v0.34.22 fixture
        run: |
          F=/tmp/v03422-fixture
          mkdir -p "$F/data/chars" "$F/data/levels" "$F/data/bgs"
          cat > "$F/data/models.txt" <<'EOF'
          load Hero data/chars/hero.txt
          load Sneak data/chars/sneak.txt
          EOF
          cat > "$F/data/levels.txt" <<'EOF'
          completebg 1
          set Smoke
          noshare 1
          skipselect 1
          cansave 2
          file data/levels/smoke.txt
          EOF
          cat > "$F/data/chars/hero.txt" <<'EOF'
          name Hero
          type player
          health 120
          speed 18
          jumpspeed 20
          walkoffmove 2 1
          anim idle
          loop 1
          delay 8
          frame none
          anim attack1
          delay 4
          attack 0 0 40 40 8
          frame none
          EOF
          cat > "$F/data/chars/sneak.txt" <<'EOF'
          name Sneak
          type enemy
          health 9999
          stealth 5 7
          nomove 1
          anim idle
          loop 1
          delay 10
          frame none
          EOF
          cat > "$F/data/levels/smoke.txt" <<'EOF'
          direction right
          spawn Sneak
          map1
          coords 180 205 0
          at 0
          boss 1
          EOF
          "$NATIVE_BUILDER" convert "$F" /tmp/v03422-port
          grep -q "completebg x1 -> SUPPORTED" /tmp/v03422-port/reports/compatibility-report.txt
          grep -q "map1 x1 -> SUPPORTED" /tmp/v03422-port/reports/compatibility-report.txt
          grep -q "walkoffmove x1 -> SUPPORTED" /tmp/v03422-port/reports/compatibility-report.txt
          grep -q "stealth x1 -> SUPPORTED" /tmp/v03422-port/reports/compatibility-report.txt
          grep -q "playStageCompleteScreen" /tmp/v03422-port/runtime/src/Engine.cpp

      - name: Native gameplay smoke
        run: |
          cmake -S /tmp/v03422-port/runtime -B /tmp/v03422-port/runtime/build-native -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/v03422-port/runtime/build-native -j2
          /tmp/v03422-port/runtime/build-native/openbor-port --smoke-game --smoke-frames=300 | tee /tmp/smoke.log
          grep -q "SMOKE GAME OK frames=300" /tmp/smoke.log

      - name: Cross-build generated game Win64
        run: |
          cmake -S /tmp/v03422-port/runtime -B /tmp/v03422-runtime-win -G Ninja             -DCMAKE_BUILD_TYPE=Release             -DCMAKE_SYSTEM_NAME=Windows             -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++             -DCMAKE_RC_COMPILER=x86_64-w64-mingw32-windres
          cmake --build /tmp/v03422-runtime-win -j2
          test -f /tmp/v03422-runtime-win/openbor-port.exe
          file /tmp/v03422-runtime-win/openbor-port.exe
          x86_64-w64-mingw32-objdump -p /tmp/v03422-runtime-win/openbor-port.exe | grep -E "DLL Name|Subsystem" | head -40

      - name: Assemble portable Builder
        run: |
          NAME=OpenBOR-Native-Builder-v0.34.22-Portable-Windows-x64
          mkdir -p "/tmp/$NAME"
          cp /tmp/ob22-win/openbor-native-builder.exe "/tmp/$NAME/OpenBOR-Native-Builder.exe"
          cat > "/tmp/$NAME/LEIA-ME.txt" <<'EOF'
          OpenBOR Native Builder v0.34.22 - Portable Windows x64

          completebg: native stage-complete screen
          map1/map2/...: spawn palette shorthand
          stealth/perception: native target filtering
          walkoffmove: native platform walk-off control
          noshare: metadata preserved; individual credit pools remain PARTIAL

          Validation: Linux regression/runtime smoke + MinGW Win64 Builder/runtime cross-build.
          EOF
          (cd /tmp && zip -9 -r "$NAME.zip" "$NAME")
          sha256sum "/tmp/$NAME/OpenBOR-Native-Builder.exe" > /tmp/EXE-SHA256.txt
          sha256sum "/tmp/$NAME.zip" > /tmp/ZIP-SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: OpenBOR-Native-Builder-v0.34.22-Portable-Windows-x64
          path: |
            /tmp/OpenBOR-Native-Builder-v0.34.22-Portable-Windows-x64.zip
            /tmp/EXE-SHA256.txt
            /tmp/ZIP-SHA256.txt
          if-no-files-found: error
          retention-days: 1
