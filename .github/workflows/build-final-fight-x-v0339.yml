name: Build OpenBOR Native Builder v0.34.23 MinGW

on:
  push:
    branches: [build-openbor-v03423]
    paths:
      - ".github/workflows/build-final-fight-x-v0339.yml"
      - "ci/openbor-v03423/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build mingw-w64 zip

      - name: Reconstruct source
        run: |
          cat ci/openbor-v03423/hex00.txt | tr -d '[:space:]' | xxd -r -p > /tmp/openbor-v03423.tar.xz
          tar -xJf /tmp/openbor-v03423.tar.xz -C /tmp
          test -f /tmp/OpenBOR-Native-Builder-v0.34.23-Source-Code/CMakeLists.txt
          echo "SRC=/tmp/OpenBOR-Native-Builder-v0.34.23-Source-Code" >> "$GITHUB_ENV"

      - name: Build native Builder and regression
        run: |
          cmake -S "$SRC" -B /tmp/ob23-native -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/ob23-native -j2
          ctest --test-dir /tmp/ob23-native --output-on-failure
          /tmp/ob23-native/openbor-native-builder version || true
          echo "NATIVE_BUILDER=/tmp/ob23-native/openbor-native-builder" >> "$GITHUB_ENV"

      - name: Cross-build Win64 Builder
        run: |
          cmake -S "$SRC" -B /tmp/ob23-win -G Ninja             -DCMAKE_BUILD_TYPE=Release             -DCMAKE_SYSTEM_NAME=Windows             -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++             -DCMAKE_RC_COMPILER=x86_64-w64-mingw32-windres
          cmake --build /tmp/ob23-win --target openbor-native-builder -j2
          test -f /tmp/ob23-win/openbor-native-builder.exe
          file /tmp/ob23-win/openbor-native-builder.exe
          x86_64-w64-mingw32-objdump -p /tmp/ob23-win/openbor-native-builder.exe | grep -E "DLL Name|Subsystem" | head -30

      - name: Generate multiplayer fixture and smoke
        run: |
          F=/tmp/v03423-fixture
          mkdir -p "$F/data/chars" "$F/data/levels"
          cat > "$F/data/models.txt" <<'EOF'
          load Hero data/chars/hero.txt
          load Enemy data/chars/enemy.txt
          EOF
          cat > "$F/data/levels.txt" <<'EOF'
          set Coop
          noshare 1
          lives 3
          credits 2
          skipselect 1
          cansave 2
          file data/levels/test.txt
          EOF
          cat > "$F/data/chars/hero.txt" <<'EOF'
          name Hero
          type player
          health 100
          anim idle
          loop 1
          delay 8
          frame none
          anim attack1
          delay 4
          attack 0 0 40 40 8
          frame none
          EOF
          cat > "$F/data/chars/enemy.txt" <<'EOF'
          name Enemy
          type enemy
          health 100
          nomove 1
          anim idle
          loop 1
          delay 10
          frame none
          EOF
          cat > "$F/data/levels/test.txt" <<'EOF'
          direction right
          spawn Enemy
          coords 180 205 0
          at 0
          boss 1
          EOF
          "$NATIVE_BUILDER" convert "$F" /tmp/v03423-port
          grep -q "noshare x1 -> SUPPORTED" /tmp/v03423-port/reports/compatibility-report.txt
          grep -q "save_version=3" /tmp/v03423-port/runtime/src/Engine.cpp
          grep -q "joined_mask=" /tmp/v03423-port/runtime/src/Engine.cpp
          grep -q "spawn01map" /tmp/v03423-port/runtime/src/Engine.cpp
          cmake -S /tmp/v03423-port/runtime -B /tmp/v03423-port/runtime/build-native -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/v03423-port/runtime/build-native -j2
          (cd /tmp/v03423-port && ./runtime/build-native/openbor-port --smoke-game --smoke-frames=300) | tee /tmp/smoke.log
          grep -q "SMOKE GAME OK frames=300" /tmp/smoke.log

      - name: Cross-build generated game Win64
        run: |
          cmake -S /tmp/v03423-port/runtime -B /tmp/v03423-runtime-win -G Ninja             -DCMAKE_BUILD_TYPE=Release             -DCMAKE_SYSTEM_NAME=Windows             -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++             -DCMAKE_RC_COMPILER=x86_64-w64-mingw32-windres
          cmake --build /tmp/v03423-runtime-win -j2
          test -f /tmp/v03423-runtime-win/openbor-port.exe
          file /tmp/v03423-runtime-win/openbor-port.exe
          x86_64-w64-mingw32-objdump -p /tmp/v03423-runtime-win/openbor-port.exe | grep -E "DLL Name|Subsystem" | head -40

      - name: Assemble portable
        run: |
          NAME=OpenBOR-Native-Builder-v0.34.23-Portable-Windows-x64
          mkdir -p "/tmp/$NAME"
          cp /tmp/ob23-win/openbor-native-builder.exe "/tmp/$NAME/OpenBOR-Native-Builder.exe"
          cat > "/tmp/$NAME/LEIA-ME.txt" <<'EOF'
          OpenBOR Native Builder v0.34.23 - Portable Windows x64

          noshare 1: independent lives/credits per P1-P4.
          Save V3: joined_mask, alive state, per-player lives/credits.
          Individual player respawn and no free revival on stage transitions.
          Native spawn01/spawn01map/spawn000 fallback.

          Validation: regression + runtime smoke + MinGW Win64 cross-build.
          EOF
          sha256sum "/tmp/$NAME/OpenBOR-Native-Builder.exe" > /tmp/EXE-SHA256.txt
          (cd /tmp && zip -9 -r "$NAME.zip" "$NAME")
          sha256sum "/tmp/$NAME.zip" > /tmp/ZIP-SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: OpenBOR-Native-Builder-v0.34.23-Portable-Windows-x64
          path: |
            /tmp/OpenBOR-Native-Builder-v0.34.23-Portable-Windows-x64.zip
            /tmp/EXE-SHA256.txt
            /tmp/ZIP-SHA256.txt
          if-no-files-found: error
          retention-days: 1
