name: Build OpenBOR Native Builder v0.34.22

on:
  push:
    branches: [build-openbor-v03422]
    paths:
      - ".github/workflows/build-final-fight-x-v0339.yml"
      - "ci/openbor-v03422/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct v0.34.22 source
        shell: pwsh
        run: |
          $parts = Get-ChildItem "ci/openbor-v03422/hex*.txt" | Sort-Object Name
          if ($parts.Count -ne 1) { throw "Expected 1 source chunk, found $($parts.Count)" }
          $hex = (($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join "") -replace '\s',''
          $archive = Join-Path $env:RUNNER_TEMP "openbor-v03422.tar.xz"
          [IO.File]::WriteAllBytes($archive,[Convert]::FromHexString($hex))
          tar -xf $archive -C $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $src = Join-Path $env:RUNNER_TEMP "OpenBOR-Native-Builder-v0.34.22-Source-Code"
          $cmakePath = Join-Path $src "CMakeLists.txt"
          if (-not (Test-Path $cmakePath)) { throw "Source CMakeLists missing" }
          $lines = @(Get-Content $cmakePath)
          $cut = [Array]::IndexOf($lines,"enable_testing()")
          if ($cut -ge 0) { Set-Content -Encoding UTF8 $cmakePath -Value $lines[0..($cut-1)] }
          "OBNB_SRC=$src" | Out-File $env:GITHUB_ENV -Append

      - name: Configure Builder Win64
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP "obnb-v03422-build"
          cmake -S "$env:OBNB_SRC" -B "$build" -G "Visual Studio 17 2022" -A x64 -T ClangCL -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "OBNB_BUILD=$build" | Out-File $env:GITHUB_ENV -Append

      - name: Build Builder
        shell: pwsh
        run: |
          cmake --build "$env:OBNB_BUILD" --config Release --target openbor-native-builder -- /m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Get-ChildItem "$env:OBNB_BUILD" -Recurse -Filter "openbor-native-builder.exe" | Select-Object -First 1
          if (-not $exe) { throw "Builder EXE missing" }
          "OBNB_EXE=$($exe.FullName)" | Out-File $env:GITHUB_ENV -Append

      - name: Verify Builder version
        shell: pwsh
        run: |
          $out = & "$env:OBNB_EXE" version 2>&1 | Out-String
          Write-Host $out
          if ($out -notmatch "OpenBOR Native Builder 0\.34\.22") { throw "Wrong version" }
          exit 0

      - name: Generate v0.34.22 fixture port
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP "v03422-fixture"
          New-Item -ItemType Directory -Force -Path (Join-Path $fixture "data/chars") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $fixture "data/levels") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $fixture "data/bgs") | Out-Null
          Set-Content -Encoding ASCII (Join-Path $fixture "data/models.txt") -Value @(
            "load Hero data/chars/hero.txt",
            "load Sneak data/chars/sneak.txt"
          )
          Set-Content -Encoding ASCII (Join-Path $fixture "data/levels.txt") -Value @(
            "completebg 1",
            "set Smoke",
            "noshare 1",
            "skipselect 1",
            "cansave 2",
            "file data/levels/smoke.txt"
          )
          Set-Content -Encoding ASCII (Join-Path $fixture "data/chars/hero.txt") -Value @(
            "name Hero","type player","health 120","speed 18","jumpspeed 20","walkoffmove 2 1",
            "anim idle","loop 1","delay 8","frame none",
            "anim attack1","delay 4","attack 0 0 40 40 8","frame none"
          )
          Set-Content -Encoding ASCII (Join-Path $fixture "data/chars/sneak.txt") -Value @(
            "name Sneak","type enemy","health 9999","stealth 5 7","nomove 1",
            "anim idle","loop 1","delay 10","frame none"
          )
          Set-Content -Encoding ASCII (Join-Path $fixture "data/levels/smoke.txt") -Value @(
            "direction right",
            "spawn Sneak",
            "map1",
            "coords 180 205 0",
            "at 0",
            "boss 1"
          )
          $port = Join-Path $env:RUNNER_TEMP "v03422-port"
          & "$env:OBNB_EXE" convert "$fixture" "$port"
          if ($LASTEXITCODE -ne 0) { throw "Conversion failed" }
          $stages = Get-Content (Join-Path $port "runtime/generated/GeneratedStages.cpp") -Raw
          $engine = Get-Content (Join-Path $port "runtime/src/Engine.cpp") -Raw
          $report = Get-Content (Join-Path $port "reports/compatibility-report.txt") -Raw
          if ($engine -notmatch "playStageCompleteScreen" -or $engine -notmatch "walkoffMoveX" -or $engine -notmatch "modelCanPerceive") { throw "v0.34.22 runtime features missing" }
          if ($stages -notmatch '"1"') { throw "map1 palette normalization missing" }
          if ($report -notmatch "completebg x1 -> SUPPORTED" -or $report -notmatch "map1 x1 -> SUPPORTED" -or $report -notmatch "walkoffmove x1 -> SUPPORTED" -or $report -notmatch "stealth x1 -> SUPPORTED") { throw "v0.34.22 compatibility statuses missing" }
          "TEST_PORT=$port" | Out-File $env:GITHUB_ENV -Append

      - name: Build generated game
        shell: pwsh
        run: |
          $rb = Join-Path "$env:TEST_PORT" "runtime/build-ci"
          cmake -S (Join-Path "$env:TEST_PORT" "runtime") -B $rb -G "Visual Studio 17 2022" -A x64 -T ClangCL -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build $rb --config Release --target openbor-port -- /m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $game = Get-ChildItem $rb -Recurse -Filter "openbor-port.exe" | Select-Object -First 1
          if (-not $game) { throw "Game EXE missing" }
          "TEST_GAME=$($game.FullName)" | Out-File $env:GITHUB_ENV -Append

      - name: Diagnose and smoke generated game
        shell: pwsh
        run: |
          $p = Start-Process "$env:TEST_GAME" -ArgumentList "--diagnose" -WorkingDirectory "$env:TEST_PORT" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Diagnose failed: $($p.ExitCode)" }
          $p = Start-Process "$env:TEST_GAME" -ArgumentList "--smoke-game","--smoke-frames=300" -WorkingDirectory "$env:TEST_PORT" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Smoke failed: $($p.ExitCode)" }
          $log = Get-Content (Join-Path "$env:TEST_PORT" "runtime-startup.log") -Raw
          Write-Host $log
          if ($log -notmatch "SMOKE GAME OK frames=300") { throw "Smoke marker missing" }

      - name: Assemble portable Builder
        shell: pwsh
        run: |
          $name = "OpenBOR-Native-Builder-v0.34.22-Portable-Windows-x64"
          $dist = Join-Path $env:RUNNER_TEMP $name
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item "$env:OBNB_EXE" (Join-Path $dist "OpenBOR-Native-Builder.exe")
          Set-Content -Encoding UTF8 (Join-Path $dist "LEIA-ME.txt") -Value @(
            "OpenBOR Native Builder v0.34.22 - Portable Windows x64",
            "",
            "Novidades:",
            "- completebg mostra bgs/complete antes da proxima fase.",
            "- map1/map2/... normalizados para palette map do spawn.",
            "- stealth/perception usados pela IA e findtarget.",
            "- walkoffmove aplica controle X/Z em quedas naturais de plataforma.",
            "- nocheats/nodebug tratados sem UNKNOWN.",
            "- noshare preservado como metadata; split de creditos P1-P4 ainda PARTIAL.",
            "",
            "Validacao Windows: Builder + runtime gerado + diagnose + smoke 300 frames."
          )
          $hash=(Get-FileHash (Join-Path $dist "OpenBOR-Native-Builder.exe") -Algorithm SHA256).Hash.ToLower()
          Set-Content -Encoding ASCII (Join-Path $dist "SHA256.txt") -Value ($hash+"  OpenBOR-Native-Builder.exe")
          $zip=Join-Path $env:RUNNER_TEMP ($name+".zip")
          Compress-Archive -Path $dist -DestinationPath $zip -CompressionLevel Optimal -Force
          "DIST_ZIP=$zip" | Out-File $env:GITHUB_ENV -Append

      - uses: actions/upload-artifact@v4
        with:
          name: OpenBOR-Native-Builder-v0.34.22-Portable-Windows-x64
          path: ${{ env.DIST_ZIP }}
          if-no-files-found: error
          retention-days: 1
