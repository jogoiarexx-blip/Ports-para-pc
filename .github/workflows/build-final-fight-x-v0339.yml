name: Build OpenBOR Native Builder v0.34.24

on:
  push:
    branches: [build-openbor-v03424]
    paths:
      - ".github/workflows/build-final-fight-x-v0339.yml"
      - "ci/openbor-v03424/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct v0.34.24 source
        shell: pwsh
        run: |
          $parts = Get-ChildItem "ci/openbor-v03424/hex*.txt" | Sort-Object Name
          if ($parts.Count -ne 1) { throw "Expected 1 source chunk, found $($parts.Count)" }
          $hex = (($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join "") -replace '\s',''
          $archive = Join-Path $env:RUNNER_TEMP "openbor-v03424.tar.xz"
          [IO.File]::WriteAllBytes($archive,[Convert]::FromHexString($hex))
          tar -xf $archive -C $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $src = Join-Path $env:RUNNER_TEMP "OpenBOR-Native-Builder-v0.34.24-Source-Code"
          $cmake = Join-Path $src "CMakeLists.txt"
          if (-not (Test-Path $cmake)) { throw "CMakeLists missing after source reconstruction" }
          $lines = @(Get-Content $cmake)
          $cut = [Array]::IndexOf($lines,"enable_testing()")
          if ($cut -ge 0) {
            Set-Content -Encoding UTF8 $cmake -Value $lines[0..($cut-1)]
          }
          "OBNB_SRC=$src" | Out-File $env:GITHUB_ENV -Append

      - name: Configure Builder Win64 ClangCL
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP "obnb-v03424-build"
          cmake -S "$env:OBNB_SRC" -B "$build" -G "Visual Studio 18 2026" -A x64 -T ClangCL -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "OBNB_BUILD=$build" | Out-File $env:GITHUB_ENV -Append

      - name: Build Builder Release
        shell: pwsh
        run: |
          cmake --build "$env:OBNB_BUILD" --config Release --target openbor-native-builder -- /m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Get-ChildItem "$env:OBNB_BUILD" -Recurse -Filter "openbor-native-builder.exe" | Select-Object -First 1
          if (-not $exe) { throw "Builder EXE missing" }
          "OBNB_EXE=$($exe.FullName)" | Out-File $env:GITHUB_ENV -Append

      - name: Verify Builder v0.34.24
        shell: pwsh
        run: |
          $out = & "$env:OBNB_EXE" version 2>&1 | Out-String
          Write-Host $out
          if ($out -notmatch "OpenBOR Native Builder 0\.34\.24") { throw "Wrong Builder version" }
          exit 0

      - name: Generate v0.34.24 feature fixture
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP "v03424-fixture"
          New-Item -ItemType Directory -Force -Path (Join-Path $fixture "data/chars") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $fixture "data/levels") | Out-Null

          Set-Content -Encoding ASCII (Join-Path $fixture "data/models.txt") -Value @(
            "load Hero data/chars/hero.txt",
            "load Enemy data/chars/enemy.txt"
          )

          Set-Content -Encoding ASCII (Join-Path $fixture "data/levels.txt") -Value @(
            "set FeatureTest",
            "skipselect 1",
            "cansave 2",
            "file data/levels/stage.txt"
          )

          Set-Content -Encoding ASCII (Join-Path $fixture "data/chars/hero.txt") -Value @(
            "name Hero",
            "type player",
            "health 120",
            "anim idle",
            "loop 1",
            "delay 8",
            "frame none",
            "anim attack1",
            "delay 4",
            "attack 0 0 40 40 8",
            "frame none"
          )

          Set-Content -Encoding ASCII (Join-Path $fixture "data/chars/enemy.txt") -Value @(
            "name Enemy",
            "type enemy",
            "health 60",
            "gfxshadow 1 3",
            "falldie 2",
            "fmap 1",
            "lifebarstatus 300 10 0 1 0 2 2 2 0",
            "combostyle 1",
            "atchain 1 4 0 2 2 3 0",
            "throwdamage 17",
            "anim idle",
            "loop 1",
            "delay 8",
            "drawmethod 512 512 0 0 0 0 -1 0 0 0",
            "frame none",
            "anim fall",
            "delay 8",
            "frame none",
            "anim death",
            "delay 8",
            "frame none"
          )

          Set-Content -Encoding ASCII (Join-Path $fixture "data/levels/stage.txt") -Value @(
            "direction right",
            "spawn1 20 5 0",
            "spawn Enemy",
            "coords 170 205 0",
            "at 0",
            "boss 1"
          )

          $port = Join-Path $env:RUNNER_TEMP "v03424-port"
          & "$env:OBNB_EXE" convert "$fixture" "$port"
          if ($LASTEXITCODE -ne 0) { throw "Fixture conversion failed" }

          $report = Get-Content (Join-Path $port "reports/compatibility-report.txt") -Raw
          $engine = Get-Content (Join-Path $port "runtime/src/Engine.cpp") -Raw
          $characters = Get-Content (Join-Path $port "runtime/generated/GeneratedCharacters.cpp") -Raw

          $required = @(
            "gfxshadow x1 -> SUPPORTED",
            "falldie x1 -> SUPPORTED",
            "fmap x1 -> SUPPORTED",
            "lifebarstatus x1 -> SUPPORTED",
            "atchain x1 -> SUPPORTED",
            "drawmethod x1 -> SUPPORTED",
            "throwdamage x1 -> SUPPORTED"
          )
          foreach ($needle in $required) {
            if ($report -notmatch [regex]::Escape($needle)) { throw "Missing support marker: $needle" }
          }

          foreach ($needle in @("deathFollowDeath","preFreezePaletteMap","gfxShadowBase","lifeBarShadowLayer")) {
            if ($engine -notmatch $needle -and $characters -notmatch $needle) { throw "Generated runtime missing: $needle" }
          }

          "TEST_PORT=$port" | Out-File $env:GITHUB_ENV -Append

      - name: Build generated game Win64
        shell: pwsh
        run: |
          $build = Join-Path "$env:TEST_PORT" "runtime/build-ci"
          cmake -S (Join-Path "$env:TEST_PORT" "runtime") -B "$build" -G "Visual Studio 18 2026" -A x64 -T ClangCL -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build "$build" --config Release --target openbor-port -- /m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $game = Get-ChildItem "$build" -Recurse -Filter "openbor-port.exe" | Select-Object -First 1
          if (-not $game) { throw "Generated game EXE missing" }
          "TEST_GAME=$($game.FullName)" | Out-File $env:GITHUB_ENV -Append

      - name: Diagnose and smoke generated game
        timeout-minutes: 3
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "$env:TEST_GAME" -ArgumentList "--diagnose" -WorkingDirectory "$env:TEST_PORT" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Diagnose failed: $($p.ExitCode)" }
          $p = Start-Process -FilePath "$env:TEST_GAME" -ArgumentList "--smoke-game","--smoke-frames=300" -WorkingDirectory "$env:TEST_PORT" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Smoke failed: $($p.ExitCode)" }
          $log = Get-Content (Join-Path "$env:TEST_PORT" "runtime-startup.log") -Raw
          Write-Host $log
          if ($log -notmatch "DIAGNOSE OK") { throw "DIAGNOSE OK missing" }
          if ($log -notmatch "SMOKE GAME OK frames=300") { throw "SMOKE GAME OK missing" }

      - name: Assemble portable Builder
        shell: pwsh
        run: |
          $name = "OpenBOR-Native-Builder-v0.34.24-Portable-Windows-x64"
          $dist = Join-Path $env:RUNNER_TEMP $name
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item "$env:OBNB_EXE" (Join-Path $dist "OpenBOR-Native-Builder.exe")
          Set-Content -Encoding UTF8 (Join-Path $dist "LEIA-ME.txt") -Value @(
            "OpenBOR Native Builder v0.34.24 - Portable Windows x64",
            "",
            "Visual/Gameplay Fidelity:",
            "- gfxshadow shadowbase 0..3",
            "- falldie 2 fall-then-death",
            "- fmap applied during freeze",
            "- lifebarstatus layered border/shadow/graph/backfill",
            "- drawmethod positional/remap forms",
            "- atchain branched combostyle 1",
            "- throwdamage numeric native support",
            "- spawn.h compatibility shim for native spawn helpers",
            "",
            "Validated on Windows x64: Builder build, generated game build, DIAGNOSE OK and 300-frame gameplay smoke."
          )
          $hash = (Get-FileHash (Join-Path $dist "OpenBOR-Native-Builder.exe") -Algorithm SHA256).Hash.ToLower()
          Set-Content -Encoding ASCII (Join-Path $dist "SHA256.txt") -Value ($hash+"  OpenBOR-Native-Builder.exe")
          $zip = Join-Path $env:RUNNER_TEMP ($name+".zip")
          Compress-Archive -Path $dist -DestinationPath $zip -CompressionLevel Optimal -Force
          "DIST_ZIP=$zip" | Out-File $env:GITHUB_ENV -Append

      - name: Upload portable Builder
        uses: actions/upload-artifact@v4
        with:
          name: OpenBOR-Native-Builder-v0.34.24-Portable-Windows-x64
          path: ${{ env.DIST_ZIP }}
          if-no-files-found: error
          retention-days: 1
