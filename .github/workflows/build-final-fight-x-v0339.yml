name: Build OpenBOR Native Builder v0.34.18

on:
  push:
    branches:
      - build-openbor-v03418
    paths:
      - ".github/workflows/build-final-fight-x-v0339.yml"
      - "ci/openbor-v03418/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct Builder source
        shell: pwsh
        run: |
          $hex = Get-Content "ci/openbor-v03418/builder.hex" -Raw
          $archive = Join-Path $env:RUNNER_TEMP "builder-v03418.tar.xz"
          [IO.File]::WriteAllBytes($archive,[Convert]::FromHexString($hex))
          tar -xf $archive -C $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $src = Join-Path $env:RUNNER_TEMP "obnb-build-payload-v03418"
          $cmakePath = Join-Path $src "CMakeLists.txt"
          if (-not (Test-Path $cmakePath)) { throw "Builder CMakeLists missing" }
          $lines = @(Get-Content $cmakePath)
          $cut = [Array]::IndexOf($lines,"enable_testing()")
          if ($cut -ge 0) {
            $kept = $lines[0..($cut-1)]
            Set-Content -Encoding UTF8 $cmakePath -Value $kept
          }
          "BUILDER_SRC=$src" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure Builder Win64 ClangCL
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP "builder-v03418-build"
          cmake -S "$env:BUILDER_SRC" -B "$build" -G "Visual Studio 18 2026" -A x64 -T ClangCL -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "BUILDER_BUILD=$build" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build Builder Release
        shell: pwsh
        run: |
          cmake --build "$env:BUILDER_BUILD" --config Release --target openbor-native-builder -- /m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Get-ChildItem "$env:BUILDER_BUILD" -Recurse -Filter "openbor-native-builder.exe" | Select-Object -First 1
          if (-not $exe) { throw "Builder EXE missing" }
          "BUILDER_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Smoke test Builder version
        shell: pwsh
        run: |
          $output = & "$env:BUILDER_EXE" version 2>&1
          $text = ($output | Out-String)
          Write-Host $text
          if ($text -notmatch "OpenBOR Native Builder 0\.34\.18") { throw "Wrong Builder version" }
          exit 0

      - name: Reconstruct generated runtime
        shell: pwsh
        run: |
          $hex = Get-Content "ci/openbor-v03418/runtime.hex" -Raw
          $archive = Join-Path $env:RUNNER_TEMP "runtime-v03418.tar.xz"
          [IO.File]::WriteAllBytes($archive,[Convert]::FromHexString($hex))
          tar -xf $archive -C $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $src = Join-Path $env:RUNNER_TEMP "obnb-runtime-payload-v03418"
          if (-not (Test-Path (Join-Path $src "CMakeLists.txt"))) { throw "Runtime CMakeLists missing" }
          "RUNTIME_SRC=$src" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure generated runtime Win64
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP "runtime-v03418-build"
          cmake -S "$env:RUNTIME_SRC" -B "$build" -G "Visual Studio 18 2026" -A x64 -T ClangCL -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "RUNTIME_BUILD=$build" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build generated runtime Release
        shell: pwsh
        run: |
          cmake --build "$env:RUNTIME_BUILD" --config Release --target openbor-port -- /m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Get-ChildItem "$env:RUNTIME_BUILD" -Recurse -Filter "openbor-port.exe" | Select-Object -First 1
          if (-not $exe) { throw "Generated runtime EXE missing" }
          "RUNTIME_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Validate generated runtime diagnose on Windows
        shell: pwsh
        run: |
          $port = Join-Path $env:RUNNER_TEMP "runtime-diagnostic-port"
          New-Item -ItemType Directory -Force -Path (Join-Path $port "assets\openbor-data") | Out-Null
          Copy-Item "$env:RUNTIME_EXE" (Join-Path $port "OpenBOR-Port.exe")
          $proc = Start-Process -FilePath (Join-Path $port "OpenBOR-Port.exe") -ArgumentList "--diagnose" -WorkingDirectory $port -PassThru -Wait
          if ($proc.ExitCode -ne 0) { throw "Generated runtime diagnose failed with code $($proc.ExitCode)" }
          $log = Join-Path $port "runtime-startup.log"
          if (-not (Test-Path $log)) { throw "runtime-startup.log missing" }
          $body = Get-Content $log -Raw
          Write-Host $body
          if ($body -notmatch "PREFLIGHT assets=ok characters=99 stages=21") { throw "Runtime preflight did not validate FFX generated data" }
          if ($body -notmatch "DIAGNOSE OK") { throw "Runtime diagnose did not finish" }

      - name: Assemble Builder portable
        shell: pwsh
        run: |
          $name = "OpenBOR-Native-Builder-v0.34.18-Portable-Windows-x64"
          $dist = Join-Path $env:RUNNER_TEMP $name
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item "$env:BUILDER_EXE" (Join-Path $dist "OpenBOR-Native-Builder.exe")
          $lines = @(
            "OpenBOR Native Builder v0.34.18 - Portable Windows x64",
            "",
            "Correcao principal: ports gerados nao fecham mais silenciosamente.",
            "O runtime Windows agora usa wWinMain, preflight, runtime-startup.log e runtime-crash.log.",
            "Pacotes novos incluem INICIAR-JOGO.cmd e DIAGNOSTICO.cmd.",
            "",
            "Compile seus jogos novamente com esta versao para receber a correcao."
          )
          Set-Content -Encoding UTF8 (Join-Path $dist "LEIA-ME.txt") -Value $lines
          $hash = (Get-FileHash (Join-Path $dist "OpenBOR-Native-Builder.exe") -Algorithm SHA256).Hash.ToLower()
          Set-Content -Encoding ascii (Join-Path $dist "SHA256.txt") -Value ($hash + "  OpenBOR-Native-Builder.exe")
          $zip = Join-Path $env:RUNNER_TEMP ($name + ".zip")
          Compress-Archive -Path $dist -DestinationPath $zip -CompressionLevel Optimal -Force
          "DIST_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload Builder portable
        uses: actions/upload-artifact@v4
        with:
          name: OpenBOR-Native-Builder-v0.34.18-Portable-Windows-x64
          path: ${{ env.DIST_ZIP }}
          if-no-files-found: error
          retention-days: 1
