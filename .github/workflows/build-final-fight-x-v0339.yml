name: Build OpenBOR Native Builder v0.34.20

on:
  push:
    branches: [build-openbor-v03420]
    paths:
      - ".github/workflows/build-final-fight-x-v0339.yml"
      - "ci/openbor-v03420/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct v0.34.20 source
        shell: pwsh
        run: |
          $parts = Get-ChildItem "ci/openbor-v03420/hex*.txt" | Sort-Object Name
          if ($parts.Count -ne 7) { throw "Expected 7 source chunks, found $($parts.Count)" }
          $hex = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ""
          $archive = Join-Path $env:RUNNER_TEMP "openbor-v03420.tar.xz"
          [IO.File]::WriteAllBytes($archive,[Convert]::FromHexString($hex))
          tar -xf $archive -C $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $src = Join-Path $env:RUNNER_TEMP "OpenBOR-Native-Builder-v0.34.20-Source-Code"
          if (-not (Test-Path (Join-Path $src "CMakeLists.txt"))) { throw "Source CMakeLists missing" }
          $lines = @(Get-Content (Join-Path $src "CMakeLists.txt"))
          $cut = [Array]::IndexOf($lines,"enable_testing()")
          if ($cut -ge 0) { Set-Content -Encoding UTF8 (Join-Path $src "CMakeLists.txt") -Value $lines[0..($cut-1)] }
          "OBNB_SRC=$src" | Out-File $env:GITHUB_ENV -Append

      - name: Configure Builder Win64
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP "obnb-v03420-build"
          cmake -S "$env:OBNB_SRC" -B "$build" -G "Visual Studio 18 2026" -A x64 -T ClangCL -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "OBNB_BUILD=$build" | Out-File $env:GITHUB_ENV -Append

      - name: Build Builder
        shell: pwsh
        run: |
          cmake --build "$env:OBNB_BUILD" --config Release --target openbor-native-builder -- /m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Get-ChildItem "$env:OBNB_BUILD" -Recurse -Filter "openbor-native-builder.exe" | Select-Object -First 1
          if (-not $exe) { throw "Builder EXE missing" }
          "OBNB_EXE=$($exe.FullName)" | Out-File $env:GITHUB_ENV -Append

      - name: Verify Builder version
        shell: pwsh
        run: |
          $out = & "$env:OBNB_EXE" version 2>&1 | Out-String
          Write-Host $out
          if ($out -notmatch "OpenBOR Native Builder 0\.34\.20") { throw "Wrong version" }
          exit 0

      - name: Generate skipselect test port
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP "v03420-fixture"
          New-Item -ItemType Directory -Force -Path (Join-Path $fixture "data/chars") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $fixture "data/levels") | Out-Null
          Set-Content -Encoding ASCII (Join-Path $fixture "data/models.txt") -Value @("load Hero data/chars/hero.txt","load Dummy data/chars/dummy.txt")
          Set-Content -Encoding ASCII (Join-Path $fixture "data/levels.txt") -Value @("set Smoke","cansave 2","skipselect 1","file data/levels/smoke.txt")
          Set-Content -Encoding ASCII (Join-Path $fixture "data/chars/hero.txt") -Value @("name Hero","type player","health 120","anim idle","loop 1","delay 8","frame none","anim attack1","delay 4","attack 0 0 40 40 8","frame none")
          Set-Content -Encoding ASCII (Join-Path $fixture "data/chars/dummy.txt") -Value @("name Dummy","type enemy","health 9999","nomove 1","anim idle","loop 1","delay 10","frame none")
          Set-Content -Encoding ASCII (Join-Path $fixture "data/levels/smoke.txt") -Value @("direction right","spawn1 20 5 0","spawn Dummy","coords 180 205 0","at 0","boss 1")
          $port = Join-Path $env:RUNNER_TEMP "v03420-port"
          & "$env:OBNB_EXE" convert "$fixture" "$port"
          if ($LASTEXITCODE -ne 0) { throw "Conversion failed" }
          $engine = Get-Content (Join-Path $port "runtime/src/Engine.cpp") -Raw
          if ($engine -notmatch "kStages\[0\]\.skipSelect" -or $engine -notmatch "else if\(accept\|\|gamepadButtonPressedFor" -or $engine -notmatch 'if\(name=="sin"\)') { throw "v0.34.20 runtime features missing" }
          "TEST_PORT=$port" | Out-File $env:GITHUB_ENV -Append

      - name: Build generated game
        shell: pwsh
        run: |
          $rb = Join-Path "$env:TEST_PORT" "runtime/build-ci"
          cmake -S (Join-Path "$env:TEST_PORT" "runtime") -B $rb -G "Visual Studio 18 2026" -A x64 -T ClangCL -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build $rb --config Release --target openbor-port -- /m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $game = Get-ChildItem $rb -Recurse -Filter "openbor-port.exe" | Select-Object -First 1
          if (-not $game) { throw "Game EXE missing" }
          "TEST_GAME=$($game.FullName)" | Out-File $env:GITHUB_ENV -Append

      - name: Diagnose and smoke generated game
        shell: pwsh
        run: |
          $p = Start-Process "$env:TEST_GAME" -ArgumentList "--diagnose" -WorkingDirectory "$env:TEST_PORT" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Diagnose failed: $($p.ExitCode)" }
          $p = Start-Process "$env:TEST_GAME" -ArgumentList "--smoke-game","--smoke-frames=300" -WorkingDirectory "$env:TEST_PORT" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Smoke failed: $($p.ExitCode)" }
          $log = Get-Content (Join-Path "$env:TEST_PORT" "runtime-startup.log") -Raw
          Write-Host $log
          if ($log -notmatch "SMOKE GAME OK frames=300") { throw "Smoke marker missing" }

      - name: Assemble portable Builder
        shell: pwsh
        run: |
          $name = "OpenBOR-Native-Builder-v0.34.20-Portable-Windows-x64"
          $dist = Join-Path $env:RUNNER_TEMP $name
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item "$env:OBNB_EXE" (Join-Path $dist "OpenBOR-Native-Builder.exe")
          Set-Content -Encoding UTF8 (Join-Path $dist "LEIA-ME.txt") -Value @(
            "OpenBOR Native Builder v0.34.20 - Portable Windows x64",
            "",
            "Correcoes principais:",
            "- skipselect agora pula a selecao generica quando o jogo pede.",
            "- Enter/Start nao e mais consumido duas vezes no Character Select.",
            "- ScriptVM adiciona sin/cos/sqrt/atan/atan2/pow/abs/floor/ceil.",
            "- detecta RAR pelo conteudo mesmo quando o arquivo se chama .zip.",
            "- aceita ports com assets/openbor-data como entrada.",
            "- conversao e build/package agora reportam status separados.",
            "- gerador Windows tenta VS 2026/ClangCL, VS 2022/ClangCL e fallback.",
            "",
            "Validacao CI: Builder Win64 + runtime gerado + diagnose + smoke 300 frames."
          )
          $hash=(Get-FileHash (Join-Path $dist "OpenBOR-Native-Builder.exe") -Algorithm SHA256).Hash.ToLower()
          Set-Content -Encoding ASCII (Join-Path $dist "SHA256.txt") -Value ($hash+"  OpenBOR-Native-Builder.exe")
          $zip=Join-Path $env:RUNNER_TEMP ($name+".zip")
          Compress-Archive -Path $dist -DestinationPath $zip -CompressionLevel Optimal -Force
          "DIST_ZIP=$zip" | Out-File $env:GITHUB_ENV -Append

      - uses: actions/upload-artifact@v4
        with:
          name: OpenBOR-Native-Builder-v0.34.20-Portable-Windows-x64
          path: ${{ env.DIST_ZIP }}
          if-no-files-found: error
          retention-days: 1
