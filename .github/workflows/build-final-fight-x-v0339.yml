name: Export OpenBOR Native Builder v0.34.18 Source
on:
  push:
    branches: [build-openbor-v03418]
    paths:
      - ".github/workflows/build-final-fight-x-v0339.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct source
        shell: pwsh
        run: |
          $parts = Get-ChildItem "ci/openbor-v03418/hex*.txt" | Sort-Object Name
          $hex = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ""
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\openbor-v03418.tar.xz",[Convert]::FromHexString($hex))
      - name: Upload exact source archive
        uses: actions/upload-artifact@v4
        with:
          name: OpenBOR-Native-Builder-v0.34.18-Exact-Source
          path: ${{ runner.temp }}\openbor-v03418.tar.xz
          if-no-files-found: error
          retention-days: 1
