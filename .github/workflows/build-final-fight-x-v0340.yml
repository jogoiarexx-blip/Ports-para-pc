          $test = Join-Path $env:FFX_BUILD "Release\v0340_blocked_entity_validator.exe"
          if (!(Test-Path $test)) { throw "v0340_blocked_entity_validator.exe not generated" }
          & $test
          if ($LASTEXITCODE -ne 0) { throw "v0.3.40 native blocked entity test failed" }

      - name: Run Stage 1 entry regression when PAK snapshot is complete
        shell: pwsh
        run: |
          $test = Join-Path $env:FFX_BUILD "Release\stage1_entry_validator.exe"
          if (!(Test-Path $test)) { throw "stage1_entry_validator.exe not generated" }
          $data = Join-Path $env:GITHUB_WORKSPACE "Final-Fight-X-Native-Portable-Windows-x64-v0.3.10\assets\data"
          if ((Test-Path (Join-Path $data "levels.txt")) -and (Test-Path (Join-Path $data "chars"))) {
