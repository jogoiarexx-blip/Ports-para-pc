          }

      - name: Report executable
        shell: pwsh
        run: |
          $exe = Join-Path $env:FFX_BUILD "Release\FinalFightX.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = (Get-Item $exe).Length
          Write-Host "Built FinalFightX.exe size=$size SHA256=$hash"

      - name: Archive reconstructed source
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "Final-Fight-X-v0.3.40-source.zip"
          Compress-Archive -Path "$env:FFX_SRC\*" -DestinationPath $zip -Force
          "FFX_SOURCE_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload reconstructed source
        uses: actions/upload-artifact@v4
        with:
          name: Final-Fight-X-v0.3.40-source
          path: ${{ env.FFX_SOURCE_ZIP }}
