name: Publish Final Fight X v0.3.11

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-final-fight-x-v0311.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download verified v0.3.11 Win64 build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $url = "https://api.github.com/repos/jogoiarexx-blip/Reposit-rios-dos-apps/actions/artifacts/10909753004/zip"
          $out = Join-Path $env:RUNNER_TEMP "ffx311-build.zip"
          $headers = @{ "Accept"="application/vnd.github+json"; "X-GitHub-Api-Version"="2022-11-28" }
          try {
            Invoke-WebRequest -Uri $url -Headers $headers -OutFile $out -MaximumRedirection 10
          } catch {
            $headers["Authorization"] = "Bearer $env:GH_TOKEN"
            Invoke-WebRequest -Uri $url -Headers $headers -OutFile $out -MaximumRedirection 10
          }
          if (!(Test-Path $out) -or (Get-Item $out).Length -lt 100000) { throw "Artifact download failed" }
          $exeDir = Join-Path $env:RUNNER_TEMP "ffx311-exe"
          Expand-Archive -Path $out -DestinationPath $exeDir -Force
          $exe = Join-Path $exeDir "FinalFightX.exe"
          if (!(Test-Path $exe)) { throw "FinalFightX.exe missing from artifact" }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne "d2d7e503b1c9c5689fd615afd89151117919e209908aa77355b9fff2ce1f3515") { throw "Unexpected EXE hash: $hash" }
          Copy-Item $exe "$env:RUNNER_TEMP/FinalFightX.exe"

      - name: Assemble portable v0.3.11
        shell: pwsh
        run: |
          $old = "Final-Fight-X-Native-Portable-Windows-x64-v0.3.10"
          $new = "Final-Fight-X-Native-Portable-Windows-x64-v0.3.11"
          if (!(Test-Path "$old/assets")) { throw "v0.3.10 assets not found" }
          New-Item -ItemType Directory -Path $new -Force | Out-Null
          if (Test-Path "$new/assets") { Remove-Item "$new/assets" -Recurse -Force }
          Copy-Item "$old/assets" "$new/assets" -Recurse
          Copy-Item "$env:RUNNER_TEMP/FinalFightX.exe" "$new/FinalFightX.exe" -Force
          $zip = "$new.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path $new -DestinationPath $zip -CompressionLevel Optimal
          if ((Get-Item $zip).Length -lt 10000000) { throw "Portable ZIP looks incomplete" }
          Get-FileHash $zip -Algorithm SHA256 | Format-List

      - name: Commit published update
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Final-Fight-X-Native-Portable-Windows-x64-v0.3.11" "Final-Fight-X-Native-Portable-Windows-x64-v0.3.11.zip"
          git commit -m "Publish Final Fight X Native v0.3.11 GPU Graphics"
          git push origin main