name: Publish Final Fight X v0.3.11

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-final-fight-x-v0311.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download verified v0.3.11 Win64 build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $url = "https://api.github.com/repos/jogoiarexx-blip/Reposit-rios-dos-apps/actions/artifacts/10909753004/zip"
          $out = Join-Path $env:RUNNER_TEMP "ffx311-build.zip"
          $headers = @{
            "Accept" = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          try {
            Invoke-WebRequest -Uri $url -Headers $headers -OutFile $out -MaximumRedirection 10
          } catch {
            $headers["Authorization"] = "Bearer $env:GH_TOKEN"
            Invoke-WebRequest -Uri $url -Headers $headers -OutFile $out -MaximumRedirection 10
          }
          if (!(Test-Path $out) -or (Get-Item $out).Length -lt 100000) { throw "Artifact download failed" }
          $exeDir = Join-Path $env:RUNNER_TEMP "ffx311-exe"
          Expand-Archive -Path $out -DestinationPath $exeDir -Force
          $exe = Join-Path $exeDir "FinalFightX.exe"
          if (!(Test-Path $exe)) { throw "FinalFightX.exe missing from artifact" }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne "d2d7e503b1c9c5689fd615afd89151117919e209908aa77355b9fff2ce1f3515") { throw "Unexpected EXE hash: $hash" }
          Copy-Item $exe "$env:RUNNER_TEMP/FinalFightX.exe"

      - name: Assemble portable v0.3.11
        shell: pwsh
        run: |
          $old = "Final-Fight-X-Native-Portable-Windows-x64-v0.3.10"
          $new = "Final-Fight-X-Native-Portable-Windows-x64-v0.3.11"
          if (!(Test-Path "$old/assets")) { throw "v0.3.10 assets not found" }
          if (Test-Path $new) { Remove-Item $new -Recurse -Force }
          New-Item -ItemType Directory -Path $new | Out-Null
          Copy-Item "$old/assets" "$new/assets" -Recurse
          Copy-Item "$env:RUNNER_TEMP/FinalFightX.exe" "$new/FinalFightX.exe"
          @'
Final Fight X Native C++ v0.3.11 - Portable Windows x64

NOVIDADES DESTA VERSAO
- Graficos GPU no menu Opcoes > Graficos GPU.
- Presets: Original, Pixel Sharp, Arcade CRT e Suave.
- Upscale: Nearest, Bilinear e Sharp Mix.
- Filtros: Desligado, Scanlines, CRT e Arcade.
- Intensidade de filtro configuravel.
- Pixel Integer Scaling.
- V-Sync configuravel.
- Render interno continua em 320x240 para preservar gameplay, hitboxes e animacoes.
- Mantida a roleta corrigida de selecao de personagens da v0.3.10.
- Mantidos fullscreen, HUD melhorado, barra de chefe, teclado e gamepad configuraveis.

COMO ABRIR
1. Extraia o ZIP completo.
2. Execute FinalFightX.exe.
3. Nao mova o EXE para fora da pasta: a pasta assets deve permanecer ao lado dele.

ATALHOS
- F11 ou Alt+Enter: alterna tela cheia.
- Teclado e gamepad podem ser configurados no menu principal.

SHA-256 FinalFightX.exe:
d2d7e503b1c9c5689fd615afd89151117919e209908aa77355b9fff2ce1f3515
'@ | Set-Content "$new/README-PORTABLE.txt" -Encoding UTF8

          $zip = "$new.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path $new -DestinationPath $zip -CompressionLevel Optimal
          if ((Get-Item $zip).Length -lt 10000000) { throw "Portable ZIP looks incomplete" }
          Get-FileHash $zip -Algorithm SHA256 | Format-List

      - name: Create GitHub Pages home
        shell: pwsh
        run: |
          @'
