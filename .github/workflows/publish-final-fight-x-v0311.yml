name: Publish Final Fight X v0.3.11

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-final-fight-x-v0311.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild verified v0.3.11 Win64 executable
        shell: pwsh
        run: |
          $source = Join-Path $env:RUNNER_TEMP "ffx-source"
          git clone --depth 1 --branch build-final-fight-x-v0311 https://github.com/jogoiarexx-blip/Reposit-rios-dos-apps.git $source
          & "$source/ci-final-fight-x-v0311/build-win64.ps1" -OutputPath "$env:RUNNER_TEMP/FinalFightX.exe"
          $exe = "$env:RUNNER_TEMP/FinalFightX.exe"
          if (!(Test-Path $exe)) { throw "FinalFightX.exe rebuild failed" }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne "d2d7e503b1c9c5689fd615afd89151117919e209908aa77355b9fff2ce1f3515") { throw "Unexpected rebuilt EXE hash: $hash" }
      - name: Assemble portable v0.3.11
        shell: pwsh
        run: |
          $old = "Final-Fight-X-Native-Portable-Windows-x64-v0.3.10"
          $new = "Final-Fight-X-Native-Portable-Windows-x64-v0.3.11"
          if (!(Test-Path "$old/assets")) { throw "v0.3.10 assets not found" }
          New-Item -ItemType Directory -Path $new -Force | Out-Null
          if (Test-Path "$new/assets") { Remove-Item "$new/assets" -Recurse -Force }
          Copy-Item "$old/assets" "$new/assets" -Recurse
          Copy-Item "$env:RUNNER_TEMP/FinalFightX.exe" "$new/FinalFightX.exe" -Force
          $zip = "$new.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path $new -DestinationPath $zip -CompressionLevel Optimal
          if ((Get-Item $zip).Length -lt 10000000) { throw "Portable ZIP looks incomplete" }
          Get-FileHash $zip -Algorithm SHA256 | Format-List

      - name: Commit published update
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Final-Fight-X-Native-Portable-Windows-x64-v0.3.11" "Final-Fight-X-Native-Portable-Windows-x64-v0.3.11.zip"
          git commit -m "Publish Final Fight X Native v0.3.11 GPU Graphics"
          git push origin main