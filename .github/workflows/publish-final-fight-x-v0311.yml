'@ | Set-Content "index.html" -Encoding UTF8
          New-Item ".nojekyll" -ItemType File -Force | Out-Null

      - name: Commit published update
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Final-Fight-X-Native-Portable-Windows-x64-v0.3.11" "Final-Fight-X-Native-Portable-Windows-x64-v0.3.11.zip" "index.html" ".nojekyll"
          git commit -m "Publish Final Fight X Native v0.3.11 GPU Graphics"
          git push origin main