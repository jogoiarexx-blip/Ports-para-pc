name: Build Final Fight X v0.3.20

on:
  push:
    branches:
      - build-ffx-v0320
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source
        shell: pwsh
        run: |
          $chunks = Get-ChildItem "ci/v0320/ffx-v0320-src.b64.*" | Sort-Object Name
          if ($chunks.Count -ne 7) { throw "Expected 7 source chunks, found $($chunks.Count)" }
          $b64 = ($chunks | ForEach-Object { Get-Content $_.FullName -Raw }) -join ""
          $zip = Join-Path $env:RUNNER_TEMP "ffx-v0320-src.zip"
          [IO.File]::WriteAllBytes($zip, [Convert]::FromBase64String($b64))
          $src = Join-Path $env:RUNNER_TEMP "ffx-v0320-src"
          New-Item -ItemType Directory -Force -Path $src | Out-Null
          Expand-Archive -Path $zip -DestinationPath $src -Force
          "FFX_SRC=$src" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure x64
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP "ffx-v0320-build"
          cmake -S "$env:FFX_SRC" -B "$build" -A x64
          "FFX_BUILD=$build" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build Release
        shell: pwsh
        run: |
          cmake --build "$env:FFX_BUILD" --config Release --target FinalFightX -- /m
          $exe = Join-Path $env:FFX_BUILD "Release\FinalFightX.exe"
          if (!(Test-Path $exe)) { throw "FinalFightX.exe not generated" }
          $item = Get-Item $exe
          Write-Host "Built: $($item.FullName) ($($item.Length) bytes)"

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: Final-Fight-X-v0.3.20-Windows-x64-exe
          path: ${{ env.FFX_BUILD }}\Release\FinalFightX.exe
          if-no-files-found: error
          retention-days: 1
