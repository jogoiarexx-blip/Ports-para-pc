name: Build Final Fight X v0.3.26
# scoped-validator-rerun

on:
  push:
    branches:
      - build-ffx-v0326
    paths:
      - ".github/workflows/build-final-fight-x-v0326.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct v0.3.20 compact source
        shell: pwsh
        run: |
          $chunks = Get-ChildItem "ci/v0320/ffx-v0320-src.b64.*" | Sort-Object Name
          if ($chunks.Count -ne 7) { throw "Expected 7 v0.3.20 chunks" }
          $b64 = ($chunks | ForEach-Object { Get-Content $_.FullName -Raw }) -join ""
          $zip = Join-Path $env:RUNNER_TEMP "ffx-v0320-src.zip"
          [IO.File]::WriteAllBytes($zip, [Convert]::FromBase64String($b64))
          $src = Join-Path $env:RUNNER_TEMP "ffx-v0326-src"
          New-Item -ItemType Directory -Force -Path $src | Out-Null
          Expand-Archive -Path $zip -DestinationPath $src -Force
          "FFX_SRC=$src" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Apply v0.3.22 phase 1 structural fix
        shell: pwsh
        run: |
          $chunks = Get-ChildItem "ci/v0322/ffx-v0322.patch.b64.*" | Sort-Object Name
          if ($chunks.Count -ne 3) { throw "Expected 3 v0.3.22 patch chunks" }
          $b64 = ($chunks | ForEach-Object { Get-Content $_.FullName -Raw }) -join ""
          $patch = Join-Path $env:RUNNER_TEMP "ffx-v0322.patch"
          [IO.File]::WriteAllBytes($patch, [Convert]::FromBase64String($b64))
          git -C "$env:FFX_SRC" init
          git -C "$env:FFX_SRC" add -A
          git -C "$env:FFX_SRC" -c user.name=CI -c user.email=ci@example.invalid commit -m "base v0.3.20"
          git -C "$env:FFX_SRC" apply --check --exclude=CMakeLists.txt "$patch"
          git -C "$env:FFX_SRC" apply --exclude=CMakeLists.txt "$patch"

      - name: Apply v0.3.23 focused legacy fixes
        shell: pwsh
        run: |
          Push-Location "$env:FFX_SRC"
          python "$env:GITHUB_WORKSPACE\ci\v0323\apply_data.py"
          if ($LASTEXITCODE -ne 0) { throw "v0.3.23 data patch failed" }
          python "$env:GITHUB_WORKSPACE\ci\v0323\apply_game.py"
          if ($LASTEXITCODE -ne 0) { throw "v0.3.23 game patch failed" }
          Pop-Location

      - name: Apply v0.3.24 campaign flow fix
        shell: pwsh
        run: |
          Push-Location "$env:FFX_SRC"
          python "$env:GITHUB_WORKSPACE\ci\v0324\apply_flow.py"
          if ($LASTEXITCODE -ne 0) { throw "v0.3.24 flow patch failed" }
          Pop-Location

      - name: Apply v0.3.25 player spawn safety
        shell: pwsh
        run: |
          Push-Location "$env:FFX_SRC"
          python "$env:GITHUB_WORKSPACE\ci\v0325\apply_spawn_safety.py"
          if ($LASTEXITCODE -ne 0) { throw "v0.3.25 spawn patch failed" }
          Pop-Location

      - name: Apply v0.3.26 partial fidelity fixes
        shell: pwsh
        run: |
          Push-Location "$env:FFX_SRC"
          python "$env:GITHUB_WORKSPACE\ci\v0326\apply_partial_fidelity.py"
          if ($LASTEXITCODE -ne 0) { throw "v0.3.26 fidelity patch failed" }

          $cmakePath = Join-Path $env:FFX_SRC "CMakeLists.txt"
          $c = Get-Content $cmakePath -Raw
          $c = $c.Replace('project(FinalFightXNative VERSION 0.3.20 LANGUAGES CXX)','project(FinalFightXNative VERSION 0.3.26 LANGUAGES CXX)')
          Set-Content $cmakePath $c -Encoding UTF8
          Pop-Location

          $game = Get-Content (Join-Path $env:FFX_SRC "src\Game.cpp") -Raw
          $gameh = Get-Content (Join-Path $env:FFX_SRC "src\Game.h") -Raw
          $data = Get-Content (Join-Path $env:FFX_SRC "src\OpenBorData.cpp") -Raw
          $datah = Get-Content (Join-Path $env:FFX_SRC "src\OpenBorData.h") -Raw

          if (-not $datah.Contains("float zDepth=13.f")) { throw "legacy attack Z depth missing" }
          if (-not $game.Contains("f->attack.zDepth")) { throw "combat Z depth not wired" }
          if (-not $game.Contains("owner.a+height")) { throw "projectile altitude not wired" }
          if (-not $game.Contains("owner.x,owner.z")) { throw "projectile legacy X placement missing" }
          if (-not $data.Contains('pushEvent(cur,"quake",start+q')) { throw "quake repeat parsing missing" }
          if (-not $game.Contains("shakeAmpX_=0.f")) { throw "vertical quake semantics missing" }
          if (-not $gameh.Contains("displayName")) { throw "spawn alias state missing" }
          if (-not $game.Contains("a->displayName=s.alias")) { throw "spawn alias not wired" }
          if (-not $game.Contains("findSafePlayerSpawnPoint")) { throw "v0.3.25 safe spawn lost" }
          if (-not $gameh.Contains("Mode{Scene,StageComplete")) { throw "v0.3.24 stage complete lost" }
          if (-not $game.Contains("openBorArenaEntryIntent")) { throw "v0.3.22 enemy entry lost" }
          if (-not $game.Contains("Legacy absolute mode")) { throw "v0.3.23 HUD lost" }

      - name: Validate partial fidelity assets
        shell: pwsh
        run: |
          $portable = Join-Path $env:GITHUB_WORKSPACE "Final-Fight-X-Native-Portable-Windows-x64-v0.3.10"
          python "ci\v0326\validate_partial_fidelity.py" "$portable"
          if ($LASTEXITCODE -ne 0) { throw "v0.3.26 asset validator failed" }

      - name: Validate spawn safety
        shell: pwsh
        run: |
          $portable = Join-Path $env:GITHUB_WORKSPACE "Final-Fight-X-Native-Portable-Windows-x64-v0.3.10"
          python "ci\v0325\validate_spawn_safety.py" "$portable"
          if ($LASTEXITCODE -ne 0) { throw "spawn safety validator failed" }

      - name: Validate campaign flow
        shell: pwsh
        run: |
          $portable = Join-Path $env:GITHUB_WORKSPACE "Final-Fight-X-Native-Portable-Windows-x64-v0.3.10"
          python "ci\v0324\validate_flow.py" "$portable"
          if ($LASTEXITCODE -ne 0) { throw "campaign flow validator failed" }

      - name: Configure x64
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP "ffx-v0326-build"
          cmake -S "$env:FFX_SRC" -B "$build" -A x64
          "FFX_BUILD=$build" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build Release
        shell: pwsh
        run: |
          cmake --build "$env:FFX_BUILD" --config Release --target FinalFightX -- /m
          $exe = Join-Path $env:FFX_BUILD "Release\FinalFightX.exe"
          if (!(Test-Path $exe)) { throw "FinalFightX.exe not generated" }

      - name: Report executable
        shell: pwsh
        run: |
          $exe = Join-Path $env:FFX_BUILD "Release\FinalFightX.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = (Get-Item $exe).Length
          Write-Host "Built FinalFightX.exe size=$size SHA256=$hash"

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: Final-Fight-X-v0.3.26-Windows-x64-exe
          path: ${{ env.FFX_BUILD }}\Release\FinalFightX.exe
          if-no-files-found: error
          retention-days: 1
