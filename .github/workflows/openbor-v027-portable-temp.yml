name: OpenBOR Builder v0.27 Portable Win64

on:
  push:
    branches:
      - ci-openbor-v027-final-win64
  workflow_dispatch:

jobs:
  build-portable:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Extract source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path builder | Out-Null
          Expand-Archive -LiteralPath ci-openbor-v027/source.zip -DestinationPath builder -Force
      - name: Patch Win32 external process launcher
        shell: pwsh
        run: |
          $mainPath = 'builder/src/main.cpp'
          $source = Get-Content -LiteralPath $mainPath -Raw
          $pattern = '(?s)static int runCommand\(const std::string& command\) \{\r?\n.*?\r?\n\}\r?\n\r?\nstatic std::filesystem::path findCMakeProgram'
          $replacement = @'
          static int runCommand(const std::string& command) {
              std::cout << "> " << command << "\n";
          #ifdef _WIN32
              int count=MultiByteToWideChar(CP_ACP,0,command.c_str(),-1,nullptr,0);
              if(count<=0) return 9009;
              std::wstring wide(static_cast<std::size_t>(count),L'\0');
              MultiByteToWideChar(CP_ACP,0,command.c_str(),-1,wide.data(),count);
              std::vector<wchar_t> commandLine(wide.begin(),wide.end());
              STARTUPINFOW startup{}; startup.cb=sizeof(startup);
              PROCESS_INFORMATION process{};
              if(!CreateProcessW(nullptr,commandLine.data(),nullptr,nullptr,FALSE,0,nullptr,nullptr,&startup,&process)) {
                  std::cerr << "Erro iniciando processo externo (Win32=" << GetLastError() << ")\n";
                  return 9009;
              }
              WaitForSingleObject(process.hProcess,INFINITE);
              DWORD exitCode=1;
              GetExitCodeProcess(process.hProcess,&exitCode);
              CloseHandle(process.hThread);
              CloseHandle(process.hProcess);
              return static_cast<int>(exitCode);
          #else
              return std::system(command.c_str());
          #endif
          }

          static std::filesystem::path findCMakeProgram
          '@
          $patched = [regex]::Replace($source, $pattern, $replacement, 1)
          if ($patched -eq $source) { throw 'runCommand patch was not applied' }
          [System.IO.File]::WriteAllText($mainPath, $patched, [System.Text.UTF8Encoding]::new($false))
      - name: Configure
        shell: pwsh
        run: cmake -S builder -B build-win64 -A x64 -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
      - name: Build Builder and Tests
        shell: pwsh
        run: cmake --build build-win64 --config Release --parallel
      - name: Test
        shell: pwsh
        run: ctest --test-dir build-win64 -C Release --output-on-failure
      - name: Generated runtime smoke build
        shell: pwsh
        run: |
          & build-win64/Release/openbor-native-builder.exe build builder/tests/fixtures/side_scroll generated-win64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path portable | Out-Null
          Copy-Item build-win64/Release/openbor-native-builder.exe portable/OpenBOR-Native-Builder.exe
          Copy-Item builder/README.md portable/README.md
          Copy-Item builder/CHANGELOG.md portable/CHANGELOG.md
          @"
          OpenBOR Native Builder v0.27.0 - Portable Windows x64

          Novidades principais:
          - scene/animation -> cutscene nativa temporizada
          - bossmusic
          - water
          - shadow/diesound
          - lifespan/landframe/offscreenkill
          - defense por tipo de ataque
          - blast/burn reaction bridge
          "@ | Set-Content -Encoding UTF8 portable/LEIA-ME-PORTATIL.txt
          (Get-FileHash portable/OpenBOR-Native-Builder.exe -Algorithm SHA256).Hash | Set-Content -Encoding ASCII portable/SHA256-EXE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: OpenBOR-Native-Builder-v0.27.0-Portable-Windows-x64
          path: portable/
          if-no-files-found: error
          compression-level: 9
